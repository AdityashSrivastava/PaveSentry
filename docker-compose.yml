# ==============================================================================
# PaveSentry Production Multi-Container Orchestration (Phase G)
# Stack: FastAPI Backend + Nginx Reverse Proxy + PostgreSQL 16 PostGIS + Redis 7
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Primary AI Pavement Management Application Service
  # ----------------------------------------------------------------------------
  pavesentry-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pavesentry-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=9005
      - WORKERS=4
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pavesentry}:${POSTGRES_PASSWORD:-delhi_pavesentry_2026_secure}@pavesentry-postgis:5432/${POSTGRES_DB:-pavesentry_db}
      - REDIS_URL=redis://pavesentry-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-delhi_pwd_pavesentry_jwt_secret_key_2026_production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
    depends_on:
      pavesentry-postgis:
        condition: service_healthy
      pavesentry-redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./data:/app/data:ro
    networks:
      - pavesentry-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9005/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 2. Enterprise Spatial Database: PostgreSQL 16 with PostGIS 3.4
  # ----------------------------------------------------------------------------
  pavesentry-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: pavesentry-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pavesentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delhi_pavesentry_2026_secure}
      POSTGRES_DB: ${POSTGRES_DB:-pavesentry_db}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      # Automatically initializes spatial schema and GIST indexes on first start
      - ./database/schema_postgis.sql:/docker-entrypoint-initdb.d/01_schema_postgis.sql:ro
    networks:
      - pavesentry-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pavesentry} -d ${POSTGRES_DB:-pavesentry_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. Distributed Cache & High-Speed Stream Buffer: Redis 7
  # ----------------------------------------------------------------------------
  pavesentry-redis:
    image: redis:7-alpine
    container_name: pavesentry-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - pavesentry-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 4

  # ----------------------------------------------------------------------------
  # 4. Ingress Reverse Proxy & Static Asset Accelerator: Nginx
  # ----------------------------------------------------------------------------
  pavesentry-nginx:
    image: nginx:alpine
    container_name: pavesentry-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pavesentry-api:
        condition: service_healthy
    networks:
      - pavesentry-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

# ------------------------------------------------------------------------------
# Persistent Docker Volumes
# ------------------------------------------------------------------------------
volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  pavesentry-net:
    driver: bridge
