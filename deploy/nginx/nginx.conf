# ==============================================================================
# PaveSentry Production Nginx Reverse Proxy Configuration
# Optimizes High-Throughput Ingestion, SSL Termination & Static Caching
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;

    # High-Resolution Citizen Dashcam Video / Photo Upload Limit
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (Prevents DoS on AI Inference & Telemetry Ingestion)
    limit_req_zone $binary_remote_addr zone=pavesentry_api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=pavesentry_vision_limit:10m rate=10r/s;

    # Upstream FastAPI Cluster
    upstream pavesentry_backend {
        server pavesentry-api:9005;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Security Headers (OWASP Top 10 Guidelines)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Probes for Docker / Load Balancer (Bypasses Rate Limiting)
        location /healthz {
            proxy_pass http://pavesentry_backend/healthz;
            proxy_set_header Host $host;
            access_log off;
        }

        location /readyz {
            proxy_pass http://pavesentry_backend/readyz;
            proxy_set_header Host $host;
            access_log off;
        }

        # Computer Vision Photo/Video Upload (Strict Rate Limit)
        location /api/vision/ {
            limit_req zone=pavesentry_vision_limit burst=10 nodelay;
            proxy_pass http://pavesentry_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # General REST API Endpoints
        location /api/ {
            limit_req zone=pavesentry_api_limit burst=30 nodelay;
            proxy_pass http://pavesentry_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Static Assets & Frontend UI
        location /static/ {
            proxy_pass http://pavesentry_backend/static/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Pothole Inspection Uploaded Media
        location /uploads/ {
            proxy_pass http://pavesentry_backend/uploads/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Root & Frontend Single-Page App
        location / {
            proxy_pass http://pavesentry_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
