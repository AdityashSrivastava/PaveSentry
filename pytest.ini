[pytest]
testpaths = . tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra -q --strict-markers

markers =
    unit: Isolated mathematical and algorithmic unit tests
    integration: FastAPI HTTP client endpoint integration tests
    regression: End-to-end multi-phase cross-feature tests
    devops: Docker, environment, and container health probe tests
    slow: Long-running simulations or ML matrix computations

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestAssertRewriteWarning
